name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release WebratRemovalTool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build webrat_killer.exe
        run: |
          x86_64-w64-mingw32-windres res.rc -O coff -o res.o
          x86_64-w64-mingw32-g++ -Wall -Wextra -std=c++17 -O2 main.cpp res.o -ladvapi32 -lshell32 -lole32 -loleaut32 -municode -static -s -o webrat_killer.exe
          sha256sum webrat_killer.exe > sha256.txt
          cat sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            webrat_killer.exe
            sha256.txt
          name: "WebratRemovalTool ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
